name: build-windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install PySide6 pyinstaller
      - run: >
          pyinstaller --onefile --windowed --name LobbyBalancer
          --add-data "Content;Content" --add-data "imports;imports" main.py
      - uses: actions/upload-artifact@v4
        with: { name: LobbyBalancer-windows, path: dist/LobbyBalancer.exe }
